<!DOCTYPE html>
<html>
<head>
    <title>Electrician System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
    <h2>⚡ Electrician System</h2>
    <input id="loginEmail" placeholder="Email"><br>
    <input id="loginPassword" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p onclick="showRegister()">New user? Register</p>
</div>

<!-- REGISTER -->
<div class="container" id="registerBox" style="display:none;">
    <h2>⚡ Register</h2>
    <input id="regName" placeholder="Name"><br>
    <input id="regEmail" placeholder="Email"><br>
    <input id="regPassword" type="password" placeholder="Password"><br>
    <button onclick="register()">Register</button>
    <p onclick="showLogin()">Already have account? Login</p>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

    <div class="topbar">
        <h2>⚡ Dashboard</h2>
        <button onclick="logout()">Logout</button>
    </div>

    <h3 id="welcome"></h3>

    <!-- CARDS -->
    <div class="cards">
        <div class="card" onclick="showSection('users')">
            <h4>Total Users</h4>
            <p id="userCount"></p>
        </div>

        <div class="card" onclick="showSection('electricians')">
            <h4>Electricians</h4>
            <p id="elecCount"></p>
        </div>

        <div class="card" onclick="showSection('activeJobs')">
            <h4>Active Jobs</h4>
            <p id="activeCount"></p>
        </div>

        <div class="card" onclick="showSection('completedJobs')">
            <h4>Completed Jobs</h4>
            <p id="completeCount"></p>
        </div>
    </div>

    <!-- DYNAMIC AREA -->
    <div id="sectionArea"></div>

</div>

<script src="script.js"></script>
</body>
</html>
